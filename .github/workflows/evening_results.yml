name: Evening Results
on:
  schedule:
    - cron: '30 22 * * *' # 22:30 UTC
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run Evening Job
        run: python automation.py evening
        
      - name: Pull latest changes
        run: |
          git pull origin main --rebase --autostash
      
      - name: Check for result files before commit
        id: check_results
        run: |
          if ls data/results/*.json 1> /dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "Result files found, proceeding with commit."
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "No result files to commit."
          fi
      
      - name: Commit and Push
        if: steps.check_results.outputs.found == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: Daily Results"
          file_pattern: 'data/results/*.json'
