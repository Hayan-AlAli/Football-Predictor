name: Test Soccerdata Automation

on:
  schedule:
    # Run daily at 6:00 AM UTC (adjust as needed to be before matches)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test-soccerdata:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Ensure additional scraping dependencies if needed
        # soccerdata often needs html5lib or lxml which we added to requirements
        
    - name: Run Soccerdata Test Script
      run: |
        python tests/test_soccerdata.py
